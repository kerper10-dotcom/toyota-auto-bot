name: Auto oglasi monitor

on:
  schedule:
    # Every 2 hours at minute 17 UTC. Offset avoids round-hour bot traffic.
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      send_existing:
        description: "Pošalji i trenutno aktivne oglase (samo za test, može ih biti puno)"
        type: boolean
        default: false

concurrency:
  group: auto-oglasi-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONUNBUFFERED: "1"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      FLARESOLVERR_URL: http://127.0.0.1:8191
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps

      - name: Start FlareSolverr
        run: |
          docker run -d --name flaresolverr -p 8191:8191 ghcr.io/flaresolverr/flaresolverr:latest
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8191/health >/dev/null; then
              echo "FlareSolverr ready"
              exit 0
            fi
            sleep 2
          done
          echo "FlareSolverr did not become healthy"
          docker logs flaresolverr || true
          exit 1

      - name: Check listings
        id: scrape
        run: |
          extra=""
          if [ "${{ github.event.inputs.send_existing }}" = "true" ]; then
            extra="--send-existing"
          fi
          python monitor.py $extra

      - name: Commit seen.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          if git diff --cached --quiet; then
            echo "seen.json unchanged"
            exit 0
          fi
          git commit -m "Update seen listings"
          git pull --rebase origin main
          git push

      - name: Telegram if scrape failed
        if: failure() && steps.scrape.outcome == 'failure'
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Secrets nisu postavljeni, nema Telegram alarma."
            exit 0
          fi
          IFS=',; ' read -ra CHATS <<< "$TELEGRAM_CHAT_ID"
          for chat in "${CHATS[@]}"; do
            [ -z "$chat" ] && continue
            curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${chat}" \
              --data-urlencode "text=⚠️ Auto-oglasi bot: GitHub Actions run nije uspio. Otvori Actions tab u repou." \
              --data-urlencode "disable_web_page_preview=true" \
              || true
          done
